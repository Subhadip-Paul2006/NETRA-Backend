name: NETRA CI Quality Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rust-matrix:
    name: Rust Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Show Format Diff on Failure
        if: failure()
        run: |
          cargo fmt --all
          git diff
        continue-on-error: true

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings

      - name: Capture Clippy Output on Failure
        if: failure()
        shell: bash
        run: |
          echo "## Clippy Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo clippy --workspace --all-targets --all-features >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run Unit & Integration Test Suites
        run: cargo test --workspace --verbose

      - name: Verify CLI Help Output
        run: cargo run -p netra-cli -- --help

      - name: Verify CLI Machine-Readable JSON Output
        run: cargo run -p netra-cli -- status --json

  security-audit:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check Licenses & Advisories
        working-directory: rust
        run: cargo-deny --config ../tools/deny.toml check
