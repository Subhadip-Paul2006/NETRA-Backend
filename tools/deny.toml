# Configuration for cargo-deny to enforce security, license, and dependency hygiene
[advisories]
vulnerability = "deny"
unmaintained = "none"
yanked = "warn"
notice = "warn"

[licenses]
unlicensed = "deny"
allow-osi-fsf = "either"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unicode-X11",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "0BSD",
    "Unlicense"
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://index.crates.io/"
]
