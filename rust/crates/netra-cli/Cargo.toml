[package]
name = "netra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line interface and diagnostic tool for the NETRA security platform"

[[bin]]
name = "netra"
path = "src/main.rs"

[lib]
name = "netra_cli"
path = "src/lib.rs"

[dependencies]
netra-core = { workspace = true }
netra-platform = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }

[features]
default = []
insecure-dev-keystore = ["netra-core/insecure-dev-keystore", "netra-platform/insecure-dev-keystore"]

[dev-dependencies]
tempfile = "3.18.0"

