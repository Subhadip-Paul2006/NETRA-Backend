[build]
# Default build configurations for NETRA Rust workspace

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "linker=rust-lld.exe",
    "-C", "linker-flavor=lld-link",
    "-L", "native=C:/MinGW/lib"
]





[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
debug = false
