[workspace]
members = [
    "crates/netra-core",
    "crates/netra-platform",
    "crates/netra-cli",
    "crates/netra-api"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Subhadip Paul <subhadippaulff@gmail.com>"]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Subhadip-Paul2006/NETRA-Backend"
homepage = "https://github.com/Subhadip-Paul2006/NETRA-Backend"
description = "Network & Endpoint Threat Reconnaissance Architecture"

[workspace.dependencies]
# Internal workspace crates
netra-core = { path = "crates/netra-core", version = "0.1.0" }
netra-platform = { path = "crates/netra-platform", version = "0.1.0" }
netra-api = { path = "crates/netra-api", version = "0.1.0" }

# Serialization & Configuration
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.20"

# Error Handling & Identifiers
thiserror = "2.0.12"
uuid = { version = "1.16.1", features = ["v7", "serde"] }
chrono = { version = "0.4.40", features = ["serde"] }
sha2 = "0.10.8"

# Storage & Embedded SQLite Engine
rusqlite = { version = "0.33.0", features = ["bundled", "chrono", "uuid"] }

# Asynchronous Runtime & Platform
tokio = { version = "1.44.0", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["codec"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std", "async-await"] }
async-trait = "0.1.87"

# HTTP REST Gateway & OpenAPI (Phase 5)
axum = { version = "0.8.1", default-features = false, features = ["tokio", "http1", "json", "matched-path", "original-uri", "query"] }
tower = { version = "0.5.2", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6.2", features = ["trace", "timeout", "limit", "set-header", "cors"] }
utoipa = { version = "5.3.1", features = ["uuid", "chrono"] }

# CLI & Output Presentation
clap = { version = "4.5.31", features = ["derive", "env"] }

# Structured Logging & Telemetry
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }

# Cryptography & Key Management (Phase 6)
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "rand_core", "zeroize"] }
zeroize = { version = "1.8.1", features = ["derive"] }
rand_core = { version = "0.6.4", features = ["std"] }
rand = { version = "0.8.5", features = ["std"] }
hex = "0.4.3"
base64 = "0.22.1"

# Transport Security & WebSocket (Phase 6)
rustls = { version = "0.23.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26.8"
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["rustls-tls-webpki-roots", "connect", "handshake"] }



